<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE | Business and Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" data-forge-header></header>
      <section class="content-area">
          <article class="panel hero">
            <h2>Business and Media Module</h2>
            <p>Focus: sponsorship communication, outreach planning, and social storytelling for FRC.</p>
            <iframe src="https://www.youtube.com/embed/4KlyPZ6ztiM" title="Business and Media video" allowfullscreen></iframe>
          </article>
          <article class="panel">
            <h3>Required Quiz Files</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Quiz</th><th>File</th><th>Status</th></tr></thead>
                <tbody data-module-checklist></tbody>
              </table>
            </div>
            <div class="notice"><strong>Rule:</strong> every quiz in this module must be passed to complete Business and Media.</div>
          </article>
    </section>
    </main>
    <script src="../data.js"></script>
    <script src="../app.js"></script>
    <script>document.addEventListener("DOMContentLoaded", () => renderModuleChecklist("business-media"));</script>
  </body>
</html>
