<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE | Art</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" data-forge-header></header>
      <section class="content-area">
          <article class="panel hero">
            <h2>Art Module</h2>
            <p>Focus: visual identity, pit aesthetics, and media-ready presentation standards.</p>

          </article>
          <article class="panel">
            <h3>Required Quiz Files</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Quiz</th><th>File</th><th>Status</th></tr></thead>
                <tbody data-module-checklist></tbody>
              </table>
            </div>
            <div class="notice"><strong>Rule:</strong> both art quizzes must be passed for release approvals and pit branding ownership.</div>
          </article>
    </section>
    </main>
    <script src="../data.js"></script>
    <script src="../app.js"></script>
    <script>document.addEventListener("DOMContentLoaded", () => renderModuleChecklist("art"));</script>
  </body>
</html>
