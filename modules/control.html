<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE | Control</title>
    <link rel="stylesheet" href="../site-v2.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" data-forge-header></header>
      <section class="content-area">
          <article class="panel hero">
            <h2>Control Module</h2>
            <p>Focus: safe wiring, CAN hygiene, and disciplined robot code practices.</p>

          </article>
          <article class="panel">
            <h3>Required Quiz Files</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Quiz</th><th>File</th><th>Status</th></tr></thead>
                <tbody data-module-checklist></tbody>
              </table>
            </div>
            <div class="notice"><strong>Rule:</strong> all control quizzes must be passed before competition pit certification.</div>
          </article>
    </section>
    </main>
    <script src="../data.js"></script>
    <script src="../app.js"></script>
    <script>document.addEventListener("DOMContentLoaded", () => renderModuleChecklist("control"));</script>
  </body>
</html>
