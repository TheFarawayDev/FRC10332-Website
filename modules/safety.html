<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE | Safety</title>
    <link rel="stylesheet" href="../site-v2.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" data-forge-header></header>
      <section class="content-area">
          <article class="panel hero">
            <h2>Safety Module</h2>
            <p>Focus: PPE standards, shop zones, pit behavior, and incident prevention procedures.</p>
            <iframe src="https://www.youtube.com/embed/6J4J5Jf3DoY" title="Safety video" allowfullscreen></iframe>
          </article>
          <article class="panel">
            <h3>Required Quiz Files</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Quiz</th><th>File</th><th>Status</th></tr></thead>
                <tbody data-module-checklist></tbody>
              </table>
            </div>
            <div class="notice"><strong>Rule:</strong> all safety quizzes must be passed before shop access approval.</div>
          </article>
      </section>
    </main>
    <script src="../data.js"></script>
    <script src="../app.js"></script>
    <script>document.addEventListener("DOMContentLoaded", () => renderModuleChecklist("safety"));</script>
  </body>
</html>
