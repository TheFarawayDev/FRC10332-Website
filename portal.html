<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Backend | Chargebotic Sites</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Prevent external debugging tools from breaking the page
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('eruda')) {
          e.preventDefault();
          return true;
        }
      });
    </script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" data-forge-header></header>

      <section class="content-area" data-dashboard-content="true"></section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
