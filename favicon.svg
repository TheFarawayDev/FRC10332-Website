<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep black background — no rounding -->
  <rect width="64" height="64" fill="#08090d"/>

  <!-- Left edge accent — electric blue vertical rule -->
  <rect x="0" y="0" width="4" height="64" fill="#2563eb"/>

  <!-- Top edge rule -->
  <rect x="4" y="0" width="60" height="2" fill="#1d3a6e"/>

  <!-- F lettermark — vertical stem -->
  <rect x="15" y="11" width="7" height="42" fill="#dce8f8"/>
  <!-- F top crossbar -->
  <rect x="15" y="11" width="34" height="7" fill="#dce8f8"/>
  <!-- F mid crossbar -->
  <rect x="15" y="27" width="24" height="6" fill="#dce8f8"/>

  <!-- Blue accent block — bottom right -->
  <rect x="34" y="43" width="24" height="10" fill="#2563eb"/>
  <!-- "10332" label in accent block -->
  <text
    x="46" y="51"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="6.2"
    font-weight="700"
    letter-spacing="-0.4"
    fill="#bfdbfe"
  >10332</text>
</svg>
