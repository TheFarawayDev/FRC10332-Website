<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark gradient background with modern depth -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3291ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0761d1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#0070f3;stop-opacity:0.4" />
      <stop offset="70%" style="stop-color:#0070f3;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Ambient glow -->
  <ellipse cx="32" cy="32" rx="30" ry="24" fill="url(#glowGrad)"/>
  
  <!-- Letter F -->
  <path d="M 20 16 L 44 16 L 44 22 L 28 22 L 28 30 L 40 30 L 40 36 L 28 36 L 28 48 L 20 48 Z" 
        fill="url(#letterGrad)" 
        stroke="#ffffff" 
        stroke-width="0.5" 
        opacity="0.95"/>
  
  <!-- Corner accent dots -->
  <circle cx="12" cy="12" r="1.5" fill="#0070f3" opacity="0.6"/>
  <circle cx="52" cy="12" r="1.5" fill="#0070f3" opacity="0.6"/>
</svg>
